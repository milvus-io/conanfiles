name: Try Build

run-name: Try build ${{ inputs.package }}/${{ inputs.version }} on ${{ inputs.runner }}${{ inputs.compiler != 'runner-native' && format(' ({0})', inputs.compiler) || '' }}

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'package name'
        required: true
      version:
        description: 'package version'
        required: true
      conanfile_path:
        description: 'the conanfile.py path of the package'
        required: true
        default: 'all/conanfile.py'
      runner:
        description: 'GitHub-hosted runner to use'
        required: true
        type: choice
        options:
          - ubuntu-22.04
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15
          - macos-26
        default: ubuntu-24.04-arm
      compiler:
        description: 'compiler toolchain (runner-native = runner default compiler)'
        required: true
        type: choice
        options:
          - runner-native
          - gcc-16
          - clang-23
        default: runner-native
      extra_options:
        description: 'extra conan options (e.g. -s compiler.cppstd=20 -o pkg:opt=val -c conf=val)'
        required: false
        default: '-s compiler.cppstd=20 -s:b compiler.cppstd=20'

jobs:
  try-build:
    name: try build (${{ github.event.inputs.runner }})
    runs-on: ${{ github.event.inputs.runner }}
    env:
      CONAN_HOME: ${{ startsWith(github.event.inputs.runner, 'macos-') && '/Users/runner/work/_temp/conan2' || '/home/runner/work/_temp/conan2' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Conan and dependencies
        run: |
          python -m pip install --upgrade pip
          if [ "${{ github.event.inputs.compiler }}" = "gcc-16" ] || [ "${{ github.event.inputs.compiler }}" = "clang-23" ]; then
            # First Conan release whose bundled settings support gcc 16 and clang 23.
            python -m pip install conan==2.33.0 pyyaml
          else
            python -m pip install conan==2.25.1 pyyaml
          fi
          conan --version
          conan profile detect

      - name: Detect try-build C++ standard
        id: cppstd
        env:
          INPUT_EXTRA_OPTIONS: ${{ github.event.inputs.extra_options }}
        run: |
          cppstd=$(sed -nE 's/.*(^|[[:space:]])-s(:[hb])?([=]|[[:space:]]+)compiler\.cppstd=([0-9]+).*/\4/p' <<<"$INPUT_EXTRA_OPTIONS" | tail -n 1)
          if [ -z "$cppstd" ]; then
            cppstd=20
          fi
          case "$cppstd" in
            11|14|17|20|23)
              ;;
            *)
              echo "Unsupported compiler.cppstd value in extra_options: $cppstd. Supported values: 11, 14, 17, 20, 23." >&2
              exit 1
              ;;
          esac

          echo "Using compiler.cppstd=$cppstd"
          echo "cppstd=$cppstd" >> "$GITHUB_OUTPUT"

      - name: Install toolchain
        if: github.event.inputs.compiler == 'gcc-16' || github.event.inputs.compiler == 'clang-23'
        env:
          INPUT_COMPILER: ${{ github.event.inputs.compiler }}
        run: |
          set -euo pipefail
          BIN_DIR="$RUNNER_TEMP/toolchain-bin"
          case "$RUNNER_OS/$INPUT_COMPILER" in
            macOS/clang-23)
              brew install llvm@23
              echo "$(brew --prefix llvm@23)/bin" >> "$GITHUB_PATH"
              ;;
            macOS/gcc-16)
              brew install gcc@16
              mkdir -p "$BIN_DIR"
              ln -sf "$(brew --prefix gcc@16)/bin/gcc-16" "$BIN_DIR/gcc"
              ln -sf "$(brew --prefix gcc@16)/bin/g++-16" "$BIN_DIR/g++"
              echo "$BIN_DIR" >> "$GITHUB_PATH"
              ;;
            Linux/clang-23)
              wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
              chmod +x /tmp/llvm.sh
              sudo /tmp/llvm.sh 23
              mkdir -p "$BIN_DIR"
              ln -sf /usr/bin/clang-23 "$BIN_DIR/clang"
              ln -sf /usr/bin/clang++-23 "$BIN_DIR/clang++"
              echo "$BIN_DIR" >> "$GITHUB_PATH"
              ;;
            Linux/gcc-16)
              NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
              eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
              brew install gcc@16
              mkdir -p "$BIN_DIR"
              ln -sf "$(brew --prefix gcc@16)/bin/gcc-16" "$BIN_DIR/gcc"
              ln -sf "$(brew --prefix gcc@16)/bin/g++-16" "$BIN_DIR/g++"
              # gcc-16 emits .base64 pseudo-ops that need binutils >= 2.43; the
              # runner's system as is 2.42, so prefer the binutils bundled with
              # Homebrew gcc (gcc@16 depends on binutils 2.47).
              echo "$(brew --prefix binutils)/bin" >> "$GITHUB_PATH"
              echo "$BIN_DIR" >> "$GITHUB_PATH"
              ;;
            *)
              echo "Unsupported OS/compiler combination: $RUNNER_OS/$INPUT_COMPILER" >&2
              exit 1
              ;;
          esac

      - name: Compute Conan compiler settings
        if: github.event.inputs.compiler == 'gcc-16' || github.event.inputs.compiler == 'clang-23'
        id: toolchain
        env:
          INPUT_COMPILER: ${{ github.event.inputs.compiler }}
        run: |
          set -euo pipefail
          case "$INPUT_COMPILER" in
            gcc-16)
              COMPILER=gcc
              COMPILER_VERSION=16
              LIBCXX=libstdc++11
              ;;
            clang-23)
              COMPILER=clang
              COMPILER_VERSION=23
              if [ "$RUNNER_OS" = "macOS" ]; then
                LIBCXX=libc++
              else
                LIBCXX=libstdc++11
              fi
              ;;
            *)
              echo "Unsupported compiler: $INPUT_COMPILER" >&2
              exit 1
              ;;
          esac
          echo "Using compiler=$COMPILER/$COMPILER_VERSION (libcxx=$LIBCXX)"
          echo "compiler=$COMPILER" >> "$GITHUB_OUTPUT"
          echo "compiler_version=$COMPILER_VERSION" >> "$GITHUB_OUTPUT"
          echo "libcxx=$LIBCXX" >> "$GITHUB_OUTPUT"

      - name: Cache Conan packages (compiler-specific)
        uses: actions/cache@v4
        with:
          path: ${{ env.CONAN_HOME }}/p
          key: try-build-${{ github.event.inputs.runner }}-${{ github.event.inputs.compiler }}-cppstd-${{ steps.cppstd.outputs.cppstd }}-${{ hashFiles('recipes/**/conanfile.py', 'recipes/**/conandata.yml', 'recipes/**/config.yml', 'scripts/build-and-push.sh', '.github/workflows/try-build.yml') }}
          restore-keys: |
            try-build-${{ github.event.inputs.runner }}-${{ github.event.inputs.compiler }}-cppstd-${{ steps.cppstd.outputs.cppstd }}-

      - name: Try build
        env:
          INPUT_PACKAGE: ${{ github.event.inputs.package }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_CONANFILE: ${{ github.event.inputs.conanfile_path }}
          INPUT_COMPILER: ${{ github.event.inputs.compiler }}
          INPUT_EXTRA_OPTIONS: ${{ github.event.inputs.extra_options }}
          COMPILER: ${{ steps.toolchain.outputs.compiler }}
          COMPILER_VERSION: ${{ steps.toolchain.outputs.compiler_version }}
          LIBCXX: ${{ steps.toolchain.outputs.libcxx }}
        run: |
          # Hardcoded milvus/ci channel (never published) so `conan create` always
          # builds the local recipe instead of a published @milvus/dev revision.
          ARGS=("$INPUT_PACKAGE" "$INPUT_VERSION" --conanfile "$INPUT_CONANFILE" --user-channel milvus/ci --repository testing --no-upload)
          if [ "$INPUT_COMPILER" = "gcc-16" ] || [ "$INPUT_COMPILER" = "clang-23" ]; then
            ARGS+=(--settings-mode custom --compiler "$COMPILER" --compiler-version "$COMPILER_VERSION" --libcxx "$LIBCXX")
          else
            ARGS+=(--settings-mode runner-default)
          fi
          if [ -n "$INPUT_EXTRA_OPTIONS" ]; then
            ARGS+=(--extra-options "$INPUT_EXTRA_OPTIONS")
          fi
          ./scripts/build-and-push.sh "${ARGS[@]}"
