name: Try Build

run-name: Try build ${{ inputs.package }}/${{ inputs.version }} on ${{ inputs.runner }}${{ inputs.compiler != 'runner-native' && format(' ({0})', inputs.compiler) || '' }}

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'package name'
        required: true
      version:
        description: 'package version'
        required: true
      conanfile_path:
        description: 'the conanfile.py path of the package'
        required: true
        default: 'all/conanfile.py'
      runner:
        description: 'GitHub-hosted runner to use'
        required: true
        type: choice
        options:
          - ubuntu-22.04
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15
          - macos-26
        default: ubuntu-24.04-arm
      compiler:
        description: 'compiler toolchain (runner-native = runner default compiler)'
        required: true
        type: choice
        options:
          - runner-native
          - gcc-11
          - gcc-12
          - gcc-13
          - gcc-14
          - gcc-15
          - gcc-16
          - clang-15
          - clang-16
          - clang-17
          - clang-19
          - clang-21
          - clang-22
          - clang-23
        default: runner-native
      source:
        description: 'recipe source: conanfiles = local recipes, conancenter = build a ConanCenter package'
        required: true
        type: choice
        options:
          - conanfiles
          - conancenter
        default: conanfiles
      extra_options:
        description: 'extra conan options (e.g. -s compiler.cppstd=20 -o pkg:opt=val -c conf=val)'
        required: false
        default: '-s compiler.cppstd=20 -s:b compiler.cppstd=20 -c tools.system.package_manager:mode=install'

jobs:
  try-build:
    name: try build (${{ github.event.inputs.runner }})
    runs-on: ${{ github.event.inputs.runner }}
    env:
      CONAN_HOME: ${{ startsWith(github.event.inputs.runner, 'macos-') && '/Users/runner/work/_temp/conan2' || '/home/runner/work/_temp/conan2' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Conan and dependencies
        run: |
          python -m pip install --upgrade pip
          # Conan 2.33.0: first release whose bundled settings support gcc 16 and
          # clang 23; its settings cover every gcc/clang version exposed by the
          # compiler input (gcc 12-16, clang 15-23).
          python -m pip install conan==2.33.0 pyyaml
          conan --version
          conan profile detect

      - name: Detect try-build C++ standard
        id: cppstd
        env:
          INPUT_EXTRA_OPTIONS: ${{ github.event.inputs.extra_options }}
        run: |
          cppstd=$(sed -nE 's/.*(^|[[:space:]])-s(:[hb])?([=]|[[:space:]]+)compiler\.cppstd=([0-9]+).*/\4/p' <<<"$INPUT_EXTRA_OPTIONS" | tail -n 1)
          if [ -z "$cppstd" ]; then
            cppstd=20
          fi
          case "$cppstd" in
            11|14|17|20|23)
              ;;
            *)
              echo "Unsupported compiler.cppstd value in extra_options: $cppstd. Supported values: 11, 14, 17, 20, 23." >&2
              exit 1
              ;;
          esac

          echo "Using compiler.cppstd=$cppstd"
          echo "cppstd=$cppstd" >> "$GITHUB_OUTPUT"

      - name: Install toolchain
        if: github.event.inputs.compiler != 'runner-native'
        env:
          INPUT_COMPILER: ${{ github.event.inputs.compiler }}
        run: |
          set -euo pipefail
          COMPILER_TYPE=${INPUT_COMPILER%%-*}      # gcc or clang
          COMPILER_VERSION=${INPUT_COMPILER##*-}  # e.g. 12, 16, 23
          BIN_DIR="$RUNNER_TEMP/toolchain-bin"
          mkdir -p "$BIN_DIR"
          case "$RUNNER_OS/$COMPILER_TYPE" in
            macOS/clang)
              brew install "llvm@$COMPILER_VERSION"
              # Resolve the requested compiler to absolute paths. CC/CXX are
              # honored before any PATH/name search, so nothing can silently
              # drift to the runner default (CMake otherwise finds /usr/bin/c++
              # = Apple clang first: its name search tries "c++" before
              # "clang++", and Homebrew llvm is keg-only so /opt/homebrew/bin
              # has no clang++ at all).
              BREW_LLVM="$(brew --prefix "llvm@$COMPILER_VERSION")"
              CC="$BREW_LLVM/bin/clang"
              CXX="$BREW_LLVM/bin/clang++"
              # Build tools that ignore CC/CXX and invoke clang/clang++/cc/c++
              # by name (b2, meson, autoconf, some CMake internals) must also
              # hit the requested toolchain, so expose it under every common
              # name in a prepended BIN_DIR instead of relying on PATH order.
              ln -sf "$CC"  "$BIN_DIR/clang"
              ln -sf "$CXX" "$BIN_DIR/clang++"
              ln -sf "$CC"  "$BIN_DIR/cc"
              ln -sf "$CXX" "$BIN_DIR/c++"
              echo "$BIN_DIR" >> "$GITHUB_PATH"
              # Export the macOS SDK so compilers invoked without an explicit
              # -isysroot (e.g. Boost.Build/b2, raw autotools) can still find
              # the system headers. Old clang (e.g. 15.0.7) cannot auto-detect
              # very new SDKs and otherwise fails with "unistd.h not found".
              echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"
              ;;
            macOS/gcc)
              BREW_GCC="$(brew --prefix "gcc@$COMPILER_VERSION")"
              brew install "gcc@$COMPILER_VERSION"
              CC="$BREW_GCC/bin/gcc-$COMPILER_VERSION"
              CXX="$BREW_GCC/bin/g++-$COMPILER_VERSION"
              ln -sf "$CC"  "$BIN_DIR/gcc"
              ln -sf "$CXX" "$BIN_DIR/g++"
              ln -sf "$CC"  "$BIN_DIR/cc"
              ln -sf "$CXX" "$BIN_DIR/c++"
              echo "$BIN_DIR" >> "$GITHUB_PATH"
              # Same rationale as macOS/clang: let gcc reach the SDK headers.
              echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"
              ;;
            Linux/clang)
              wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
              chmod +x /tmp/llvm.sh
              sudo /tmp/llvm.sh "$COMPILER_VERSION"
              CC="/usr/bin/clang-$COMPILER_VERSION"
              CXX="/usr/bin/clang++-$COMPILER_VERSION"
              ln -sf "$CC"  "$BIN_DIR/clang"
              ln -sf "$CXX" "$BIN_DIR/clang++"
              ln -sf "$CC"  "$BIN_DIR/cc"
              ln -sf "$CXX" "$BIN_DIR/c++"
              echo "$BIN_DIR" >> "$GITHUB_PATH"
              ;;
            Linux/gcc)
              # Prefer the distro's gcc when it provides this version. Homebrew
              # gcc@N on Linux pulls in Homebrew's own glibc (e.g. 2.39) whose
              # headers leak into the build and mismatch the system libc
              # (ubuntu-22.04 glibc 2.35), breaking configure detection
              # (strlcat/strlcpy=yes) and links of C23-redirected symbols
              # (__isoc23_strtol) against the older system libc.
              sudo apt-get update
              GCC_BIN=""
              if sudo apt-get install -y --no-install-recommends "gcc-$COMPILER_VERSION" "g++-$COMPILER_VERSION"; then
                GCC_BIN="/usr/bin"
              elif sudo apt-get install -y --no-install-recommends software-properties-common \
                && sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test \
                && sudo apt-get update \
                && sudo apt-get install -y --no-install-recommends "gcc-$COMPILER_VERSION" "g++-$COMPILER_VERSION"; then
                # The Ubuntu toolchain PPA ships a distro-glibc-consistent gcc
                # (e.g. gcc-13 on ubuntu-22.04, where the distro apt lacks it),
                # so the build keeps using the system libc headers.
                GCC_BIN="/usr/bin"
              else
                # Fall back to Homebrew for versions not packaged by the distro
                # or the toolchain PPA (e.g. gcc-15/16 on ubuntu-22.04/24.04).
                # Only viable where Homebrew's glibc (2.39) matches the system
                # libc (ubuntu-24.04 glibc 2.39).
                NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
                eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
                brew install "gcc@$COMPILER_VERSION"
                GCC_BIN="$(brew --prefix "gcc@$COMPILER_VERSION")/bin"
                # Newer GCC emits .base64 pseudo-ops that need binutils >= 2.43;
                # the runner's system as is older, so prefer the binutils bundled
                # with Homebrew gcc.
                echo "$(brew --prefix binutils)/bin" >> "$GITHUB_PATH"
              fi
              CC="$GCC_BIN/gcc-$COMPILER_VERSION"
              CXX="$GCC_BIN/g++-$COMPILER_VERSION"
              ln -sf "$CC"  "$BIN_DIR/gcc"
              ln -sf "$CXX" "$BIN_DIR/g++"
              ln -sf "$CC"  "$BIN_DIR/cc"
              ln -sf "$CXX" "$BIN_DIR/c++"
              echo "$BIN_DIR" >> "$GITHUB_PATH"
              ;;
            *)
              echo "Unsupported OS/compiler combination: $RUNNER_OS/$INPUT_COMPILER" >&2
              exit 1
              ;;
          esac
          # Absolute paths defeat every name-resolution path: CMake honors
          # CC/CXX env before its "cc"/"c++" name search, and name-calling
          # tools hit the BIN_DIR symlinks prepended above.
          echo "CC=$CC" >> "$GITHUB_ENV"
          echo "CXX=$CXX" >> "$GITHUB_ENV"

      - name: Verify toolchain matches the requested compiler
        if: github.event.inputs.compiler != 'runner-native'
        env:
          INPUT_COMPILER: ${{ github.event.inputs.compiler }}
        run: |
          set -euo pipefail
          COMPILER_VERSION=${INPUT_COMPILER##*-}

          for TOOL in "$CC" "$CXX"; do
            if [ ! -x "$TOOL" ]; then
              echo "::error::$INPUT_COMPILER: resolved compiler '$TOOL' is not executable" >&2
              exit 1
            fi
          done

          # Fail fast when the resolved compiler's reported major version does
          # not match the requested one. This is the tripwire for the class of
          # bug where the build silently used the runner default compiler
          # while the Conan profile claimed the requested version.
          check_major_version() {
            local tool="$1" name="$2" line ver major
            line="$("$tool" --version 2>&1 | head -n 1)"
            echo "::notice::$name=$tool ($line)"
            ver="$(grep -oE '[0-9]+(\.[0-9]+)+' <<<"$line" | tail -n 1)"
            major="${ver%%.*}"
            if [ "$major" != "$COMPILER_VERSION" ]; then
              echo "::error::$name='$tool' reported '$line' but compiler '$INPUT_COMPILER' requires major version $COMPILER_VERSION" >&2
              exit 1
            fi
          }
          check_major_version "$CC"  "CC"
          check_major_version "$CXX" "CXX"

      - name: Compute Conan compiler settings
        if: github.event.inputs.compiler != 'runner-native'
        id: toolchain
        env:
          INPUT_COMPILER: ${{ github.event.inputs.compiler }}
        run: |
          set -euo pipefail
          COMPILER_TYPE=${INPUT_COMPILER%%-*}
          COMPILER_VERSION=${INPUT_COMPILER##*-}
          case "$COMPILER_TYPE" in
            gcc)
              COMPILER=gcc
              LIBCXX=libstdc++11
              ;;
            clang)
              COMPILER=clang
              if [ "$RUNNER_OS" = "macOS" ]; then
                LIBCXX=libc++
              else
                LIBCXX=libstdc++11
              fi
              ;;
            *)
              echo "Unsupported compiler: $INPUT_COMPILER" >&2
              exit 1
              ;;
          esac
          echo "Using compiler=$COMPILER/$COMPILER_VERSION (libcxx=$LIBCXX)"
          echo "compiler=$COMPILER" >> "$GITHUB_OUTPUT"
          echo "compiler_version=$COMPILER_VERSION" >> "$GITHUB_OUTPUT"
          echo "libcxx=$LIBCXX" >> "$GITHUB_OUTPUT"

      - name: Cache Conan packages (compiler-specific)
        uses: actions/cache@v4
        with:
          path: ${{ env.CONAN_HOME }}/p
          key: try-build-${{ github.event.inputs.runner }}-${{ github.event.inputs.compiler }}-cppstd-${{ steps.cppstd.outputs.cppstd }}-${{ hashFiles('recipes/**/conanfile.py', 'recipes/**/conandata.yml', 'recipes/**/config.yml', 'scripts/build-and-push.sh', '.github/workflows/try-build.yml') }}
          restore-keys: |
            try-build-${{ github.event.inputs.runner }}-${{ github.event.inputs.compiler }}-cppstd-${{ steps.cppstd.outputs.cppstd }}-

      - name: Try build
        env:
          INPUT_PACKAGE: ${{ github.event.inputs.package }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_CONANFILE: ${{ github.event.inputs.conanfile_path }}
          INPUT_COMPILER: ${{ github.event.inputs.compiler }}
          INPUT_SOURCE: ${{ github.event.inputs.source }}
          INPUT_EXTRA_OPTIONS: ${{ github.event.inputs.extra_options }}
          COMPILER: ${{ steps.toolchain.outputs.compiler }}
          COMPILER_VERSION: ${{ steps.toolchain.outputs.compiler_version }}
          LIBCXX: ${{ steps.toolchain.outputs.libcxx }}
        run: |
          if [ "$INPUT_SOURCE" = "conancenter" ]; then
            # Build a ConanCenter package (no local recipe): resolve the recipe
            # from ConanCenter and build its binaries with the selected compiler.
            conan remote add default-conan-local2 "https://milvus01.jfrog.io/artifactory/api/conan/default-conan-local2" --index 0 2>/dev/null || true
            conan remote add testing2 "https://milvus01.jfrog.io/artifactory/api/conan/testing2" --index 1 2>/dev/null || true
            SETTINGS=(-s build_type=Release -s compiler.cppstd=20 -s:b compiler.cppstd=20)
            if [ "$INPUT_COMPILER" != "runner-native" ]; then
              SETTINGS+=(-s compiler="$COMPILER" -s compiler.version="$COMPILER_VERSION" -s compiler.libcxx="$LIBCXX")
            fi
            EXTRA=()
            if [ -n "$INPUT_EXTRA_OPTIONS" ]; then
              EXTRA+=($INPUT_EXTRA_OPTIONS)
            fi
            conan install --requires="$INPUT_PACKAGE/$INPUT_VERSION" --build=missing "${SETTINGS[@]}" -c tools.build:jobs=6 "${EXTRA[@]}"
            exit $?
          fi
          # Hardcoded milvus/ci channel (never published) so `conan create` always
          # builds the local recipe instead of a published @milvus/dev revision.
          ARGS=("$INPUT_PACKAGE" "$INPUT_VERSION" --conanfile "$INPUT_CONANFILE" --user-channel milvus/ci --repository testing --no-upload)
          if [ "$INPUT_COMPILER" != "runner-native" ]; then
            ARGS+=(--settings-mode custom --compiler "$COMPILER" --compiler-version "$COMPILER_VERSION" --libcxx "$LIBCXX")
          else
            ARGS+=(--settings-mode runner-default)
          fi
          if [ -n "$INPUT_EXTRA_OPTIONS" ]; then
            ARGS+=(--extra-options "$INPUT_EXTRA_OPTIONS")
          fi
          ./scripts/build-and-push.sh "${ARGS[@]}"
