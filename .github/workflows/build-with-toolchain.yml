# Manually build a single recipe with a newer compiler toolchain (gcc-16 or
# clang-23) that is not preinstalled on GitHub-hosted runners. Installs the
# toolchain, extends the Conan settings.yml (clang 23 is not in the Conan
# 2.25.1 default list), then runs build-and-push.sh with --settings-mode custom.
# Build-only validation: no Artifactory upload.
name: Build with Custom Toolchain

run-name: Build ${{ inputs.package }}/${{ inputs.version }}${{ inputs.user_channel && format('@{0}', inputs.user_channel) || '' }} with ${{ inputs.compiler }} on ${{ inputs.os }}

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'package name'
        required: true
      version:
        description: 'package version'
        required: true
      conanfile_path:
        description: 'the conanfile.py path of the package'
        required: true
        default: 'all/conanfile.py'
      compiler:
        description: 'compiler toolchain to build with'
        required: true
        type: choice
        options:
          - gcc-16
          - clang-23
        default: clang-23
      os:
        description: 'GitHub-hosted runner OS'
        required: true
        type: choice
        options:
          - ubuntu-24.04
          - macos-26
        default: ubuntu-24.04
      user_channel:
        description: 'define the user and channel for the package'
        required: false
        default: ''
      extra_options:
        description: 'extra conan options (e.g. -s compiler.cppstd=20 -o pkg:opt=val -c conf=val)'
        required: false
        default: '-s compiler.cppstd=20 -s:b compiler.cppstd=20'

jobs:
  build-with-toolchain:
    name: ${{ inputs.compiler }} / ${{ inputs.os }}
    runs-on: ${{ inputs.os }}
    env:
      CONAN_HOME: ${{ startsWith(inputs.os, 'macos-') && '/Users/runner/work/_temp/conan2' || '/home/runner/work/_temp/conan2' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Conan and dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install conan==2.25.1 pyyaml
          conan --version
          conan profile detect

      - name: Detect C++ standard
        id: cppstd
        env:
          INPUT_EXTRA_OPTIONS: ${{ inputs.extra_options }}
        run: |
          cppstd=$(sed -nE 's/.*(^|[[:space:]])-s(:[hb])?([=]|[[:space:]]+)compiler\.cppstd=([0-9]+).*/\4/p' <<<"$INPUT_EXTRA_OPTIONS" | tail -n 1)
          if [ -z "$cppstd" ]; then
            cppstd=20
          fi
          case "$cppstd" in
            11|14|17|20|23)
              ;;
            *)
              echo "Unsupported compiler.cppstd value in extra_options: $cppstd. Supported values: 11, 14, 17, 20, 23." >&2
              exit 1
              ;;
          esac
          echo "Using compiler.cppstd=$cppstd"
          echo "cppstd=$cppstd" >> "$GITHUB_OUTPUT"

      - name: Extend Conan settings for clang-23
        run: |
          python3 ./scripts/extend-conan-settings.py

      - name: Install toolchain
        env:
          INPUT_COMPILER: ${{ inputs.compiler }}
        run: |
          set -euo pipefail
          BIN_DIR="$RUNNER_TEMP/toolchain-bin"
          case "$RUNNER_OS/$INPUT_COMPILER" in
            macOS/clang-23)
              brew install llvm@23
              echo "$(brew --prefix llvm@23)/bin" >> "$GITHUB_PATH"
              ;;
            macOS/gcc-16)
              brew install gcc@16
              mkdir -p "$BIN_DIR"
              ln -sf "$(brew --prefix gcc@16)/bin/gcc-16" "$BIN_DIR/gcc"
              ln -sf "$(brew --prefix gcc@16)/bin/g++-16" "$BIN_DIR/g++"
              echo "$BIN_DIR" >> "$GITHUB_PATH"
              ;;
            Linux/clang-23)
              wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
              chmod +x /tmp/llvm.sh
              sudo /tmp/llvm.sh 23
              mkdir -p "$BIN_DIR"
              ln -sf /usr/bin/clang-23 "$BIN_DIR/clang"
              ln -sf /usr/bin/clang++-23 "$BIN_DIR/clang++"
              echo "$BIN_DIR" >> "$GITHUB_PATH"
              ;;
            Linux/gcc-16)
              NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
              eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
              brew install gcc@16
              mkdir -p "$BIN_DIR"
              ln -sf "$(brew --prefix gcc@16)/bin/gcc-16" "$BIN_DIR/gcc"
              ln -sf "$(brew --prefix gcc@16)/bin/g++-16" "$BIN_DIR/g++"
              echo "$BIN_DIR" >> "$GITHUB_PATH"
              ;;
            *)
              echo "Unsupported OS/compiler combination: $RUNNER_OS/$INPUT_COMPILER" >&2
              exit 1
              ;;
          esac
          if command -v gcc; then gcc --version | head -n1; fi
          if command -v clang; then clang --version | head -n1; fi

      - name: Compute Conan compiler settings
        id: toolchain
        env:
          INPUT_COMPILER: ${{ inputs.compiler }}
        run: |
          set -euo pipefail
          case "$INPUT_COMPILER" in
            gcc-16)
              COMPILER=gcc
              COMPILER_VERSION=16
              LIBCXX=libstdc++11
              ;;
            clang-23)
              COMPILER=clang
              COMPILER_VERSION=23
              if [ "$RUNNER_OS" = "macOS" ]; then
                LIBCXX=libc++
              else
                LIBCXX=libstdc++11
              fi
              ;;
            *)
              echo "Unsupported compiler: $INPUT_COMPILER" >&2
              exit 1
              ;;
          esac
          echo "Using compiler=$COMPILER/$COMPILER_VERSION (libcxx=$LIBCXX)"
          echo "compiler=$COMPILER" >> "$GITHUB_OUTPUT"
          echo "compiler_version=$COMPILER_VERSION" >> "$GITHUB_OUTPUT"
          echo "libcxx=$LIBCXX" >> "$GITHUB_OUTPUT"

      - name: Cache Conan packages (compiler-specific)
        uses: actions/cache@v4
        with:
          path: ${{ env.CONAN_HOME }}/p
          key: build-with-toolchain-${{ inputs.os }}-${{ inputs.compiler }}-cppstd-${{ steps.cppstd.outputs.cppstd }}-${{ hashFiles('recipes/**/conanfile.py', 'recipes/**/conandata.yml', 'recipes/**/config.yml', 'scripts/build-and-push.sh', 'scripts/extend-conan-settings.py', '.github/workflows/build-with-toolchain.yml') }}
          restore-keys: |
            build-with-toolchain-${{ inputs.os }}-${{ inputs.compiler }}-cppstd-${{ steps.cppstd.outputs.cppstd }}-

      - name: Build with toolchain
        env:
          INPUT_PACKAGE: ${{ inputs.package }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_CONANFILE: ${{ inputs.conanfile_path }}
          INPUT_USER_CHANNEL: ${{ inputs.user_channel }}
          INPUT_EXTRA_OPTIONS: ${{ inputs.extra_options }}
          COMPILER: ${{ steps.toolchain.outputs.compiler }}
          COMPILER_VERSION: ${{ steps.toolchain.outputs.compiler_version }}
          LIBCXX: ${{ steps.toolchain.outputs.libcxx }}
        run: |
          ARGS=("$INPUT_PACKAGE" "$INPUT_VERSION" --conanfile "$INPUT_CONANFILE" --settings-mode custom --compiler "$COMPILER" --compiler-version "$COMPILER_VERSION" --libcxx "$LIBCXX" --repository testing --no-upload)
          if [ -n "$INPUT_USER_CHANNEL" ]; then
            ARGS+=(--user-channel "$INPUT_USER_CHANNEL")
          fi
          if [ -n "$INPUT_EXTRA_OPTIONS" ]; then
            ARGS+=(--extra-options "$INPUT_EXTRA_OPTIONS")
          fi
          ./scripts/build-and-push.sh "${ARGS[@]}"
