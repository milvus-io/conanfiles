pull_request_rules:
  - name: Add needs-dco label when DCO check failed
    conditions:
      - base=master
      - -check-success=DCO
    actions:
      label:
        remove:
          - dco-passed
        add:
          - needs-dco

  - name: Add dco-passed label when DCO check passed
    conditions:
      - base=master
      - check-success=DCO
    actions:
      label:
        remove:
          - needs-dco
        add:
          - dco-passed

  - name: Add ci-passed when PR verification passed
    conditions:
      - base=master
      - 'files~=^(recipes/|scripts/(build-and-push\.sh|pr-detection\.py)$|\.github/workflows/pr-verify-recipes\.yml$)'
      - 'check-success=verify recipe versions'
    actions:
      label:
        add:
          - ci-passed

  - name: Add ci-passed for PR verification skipped changes
    conditions:
      - base=master
      - '-files~=^(recipes/|scripts/(build-and-push\.sh|pr-detection\.py)$|\.github/workflows/pr-verify-recipes\.yml$)'
    actions:
      label:
        add:
          - ci-passed

  - name: Remove ci-passed when PR verification is not successful
    conditions:
      - base=master
      - 'files~=^(recipes/|scripts/(build-and-push\.sh|pr-detection\.py)$|\.github/workflows/pr-verify-recipes\.yml$)'
      - or:
          - check-pending=verify recipe versions
          - check-failure=verify recipe versions
    actions:
      label:
        remove:
          - ci-passed

  - name: Auto-queue when all review labels present
    conditions:
      - base=master
      - and:
          - label=approved
          - label=dco-passed
          - label=ci-passed
          - label=lgtm
    actions:
      queue:
